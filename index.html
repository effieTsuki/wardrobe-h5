<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c97b5a">
<title>我的衣橱</title>
<script src="config.js"></script>
<style>
  :root {
    --primary: #c97b5a;
    --primary-bright: #e8a87c;
    --primary-deep: #a9603c;
    --primary-soft: #f7e8dd;
    --bg: #faf5ee;
    --card: #fffdf9;
    --text: #43302b;
    --muted: #8a7365;
    --border: #eee3d6;
    --danger: #dc2626;
    --shadow: 0 2px 6px rgba(93,64,45,.05), 0 10px 26px rgba(93,64,45,.09);
    --shadow-lg: 0 12px 40px rgba(60,40,25,.20);
    --grad: linear-gradient(135deg, #e8a87c, #c97b5a 55%, #a9603c);
    --warm-gray: #f6efe6;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 90% 55% at 8% -8%, rgba(232,168,124,.16), transparent 60%),
      radial-gradient(ellipse 65% 45% at 96% 4%, rgba(224,148,167,.12), transparent 60%),
      radial-gradient(ellipse 85% 50% at 50% 108%, rgba(201,123,90,.09), transparent 60%);
    background-attachment: fixed;
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    padding-bottom: calc(84px + var(--safe-bottom));
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { font-family: inherit; font-size: 15px; color: var(--text); }
  img { display: block; }

  /* ================= 顶栏 ================= */
  .header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,253,249,.8);
    backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border-bottom: 1px solid rgba(238,227,214,.9);
    padding: 14px 16px 14px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 12px;
    background: linear-gradient(135deg, #e8a87c, #c97b5a 55%, #8f4d33);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(201,123,90,.35);
  }
  .brand .logo svg { width: 22px; height: 22px; stroke: #fff; }
  .brand h1 {
    margin: 0; font-size: 20px; font-weight: 800; letter-spacing: .3px;
    background: linear-gradient(120deg, #7c4a2d, #c97b5a 45%, #e8a87c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand .sub { font-size: 11px; color: var(--muted); margin-top: -2px; letter-spacing: .5px; }

  /* 统计卡片 */
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 11px; margin-top: 14px; }
  .stat {
    display: flex; align-items: center; gap: 9px;
    background: rgba(255,253,249,.85);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid #f0e5d8; border-radius: 16px;
    padding: 11px 12px;
    box-shadow: 0 3px 14px rgba(93,64,45,.06);
  }
  .stat .s-icon {
    flex: 0 0 auto; width: 33px; height: 33px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: #f9efe4;
  }
  .stat .s-icon svg { width: 17px; height: 17px; }
  .s-icon.i-count svg { stroke: #c97b5a; }
  .s-icon.i-total svg { stroke: #b8985e; }
  .s-icon.i-avg svg { stroke: #b06a75; }
  .stat .s-txt { display: flex; flex-direction: column; min-width: 0; }
  .stat .num { font-size: 18px; font-weight: 800; color: var(--text); line-height: 1.15; letter-spacing: -.3px; }
  .stat .lbl { font-size: 10.5px; color: #8a7261; margin-top: 1px; }

  /* ================= 分类 chips ================= */
  .cats {
    display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px 4px;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 26px), transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 26px), transparent 100%);
  }
  .cats::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 9px 17px; border-radius: 999px;
    background: rgba(255,253,249,.95); border: 1px solid var(--border);
    color: var(--muted); font-size: 13.5px; white-space: nowrap; font-weight: 500;
    line-height: 1.35; transition: all .18s ease;
  }
  .chip:active { transform: scale(.95); }
  .chip.on {
    background: var(--grad); border-color: transparent; color: #fff; font-weight: 700;
    box-shadow: 0 5px 16px rgba(201,123,90,.35);
  }

  /* ================= 工具栏 ================= */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; padding: 10px 16px 6px; gap: 6px 10px; }
  .toolbar .tags { display: flex; flex-wrap: wrap; gap: 6px; flex: 0 1 auto; }
  .tag {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 999px; font-size: 12.5px;
    background: #faf3ec; border: 1px solid #eadfd2; color: #9a8675;
    transition: all .15s ease;
  }
  .tag:active { transform: scale(.93); }
  .tag.on {
    background: #fdf0e5; border-color: #edc9ab; color: var(--primary-deep); font-weight: 700;
  }
  .tag.reset {
    border-style: dashed; color: #a08a7a; background: transparent;
  }
  .tag.reset.on {
    border-style: solid; color: var(--primary-deep); background: #fdf0e5; border-color: #edc9ab;
  }
  .tag .sdot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .row-break { flex-basis: 100%; height: 0; width: 0; }
  .btn-sort {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; margin-left: auto;
    align-self: flex-start; margin-top: 0;
    padding: 6px 11px; border-radius: 999px; background: rgba(255,253,249,.9);
    border: 1px solid var(--border); font-size: 12.5px; color: var(--text); font-weight: 600;
    box-shadow: 0 2px 8px rgba(93,64,45,.05);
  }
  .btn-sort:active { transform: scale(.95); }
  .btn-sort svg { width: 14px; height: 14px; stroke: var(--primary); }

  /* ================= 卡片网格 ================= */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; padding: 10px 16px 24px; }
  .card {
    background: var(--card); border-radius: 20px; overflow: hidden;
    box-shadow: 0 2px 6px rgba(93,64,45,.04), 0 10px 26px rgba(93,64,45,.08);
    border: 1px solid rgba(240,229,216,.85);
    display: flex; flex-direction: column;
    animation: cardIn .45s cubic-bezier(.2,.8,.25,1) backwards;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:active { transform: scale(.97); box-shadow: 0 4px 14px rgba(93,64,45,.12); }
  @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
  .card .thumb {
    position: relative; aspect-ratio: 1/1;
    background: linear-gradient(140deg, #f7ead9 0%, #faf5ec 45%, #f5e8e2 100%);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card .thumb .ph { opacity: .55; }
  .card .cat-badge {
    position: absolute; top: 10px; left: 10px;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700;
    background: rgba(255,253,249,.85); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    color: #6b5446; box-shadow: 0 2px 8px rgba(93,64,45,.12);
  }
  .card .cat-badge::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--cc, #a9866f);
  }
  .card .del {
    position: absolute; top: 8px; right: 8px; width: 27px; height: 27px;
    border-radius: 50%; background: rgba(67,48,43,.42);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .15s ease;
  }
  .card:active .del, .card:hover .del { opacity: 1; }
  .card .del svg { width: 13px; height: 13px; stroke: #fff; }
  .card .body { padding: 11px 12px 12px; }
  .card .name {
    font-size: 14.5px; font-weight: 700; margin-bottom: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; min-height: 18px; }
  .card .meta .cdot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(0,0,0,.07); flex: 0 0 auto; }
  .gpill, .spill {
    font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px; line-height: 1.5;
  }
  .gpill { background: #f6efe6; color: #6f5b4c; }
  .card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; }
  .price-badge {
    display: inline-flex; align-items: baseline; gap: 1px;
    padding: 4px 11px; border-radius: 999px;
    background: var(--grad); color: #fff;
    font-size: 13.5px; font-weight: 800; letter-spacing: .2px;
    box-shadow: 0 4px 12px rgba(201,123,90,.32);
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .price-badge small { font-size: 10px; font-weight: 600; opacity: .85; margin-right: 1px; }
  .age-pill { font-size: 11px; color: #7d6a58; background: #f4ece1; padding: 3px 8px; border-radius: 999px; font-weight: 500; }

  /* ================= 空态 ================= */
  .empty { grid-column: 1 / -1; text-align: center; padding: 42px 20px 60px; }
  .empty .art {
    width: 118px; height: 118px; margin: 0 auto 18px; border-radius: 36px;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.85), transparent 55%),
      linear-gradient(140deg, #f3ddc4, #f7d9c8 60%, #fce6d0);
    box-shadow: 0 18px 44px rgba(201,123,90,.22), inset 0 0 0 1px rgba(255,255,255,.5);
    display: flex; align-items: center; justify-content: center;
    animation: floaty 3.2s ease-in-out infinite;
  }
  @keyframes floaty { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  .empty .art svg { width: 54px; height: 54px; }
  .empty .t { font-size: 17px; font-weight: 800; color: var(--text); }
  .empty .s { font-size: 13.5px; color: var(--muted); margin-top: 5px; }
  .empty-btn {
    margin-top: 18px; padding: 11px 26px; border-radius: 999px;
    background: var(--grad); color: #fff; font-size: 14.5px; font-weight: 700;
    box-shadow: 0 8px 22px rgba(201,123,90,.35);
    display: inline-flex; align-items: center; gap: 5px;
    transition: transform .15s ease;
  }
  .empty-btn:active { transform: scale(.95); }

  /* ================= FAB ================= */
  .fab {
    position: fixed; right: 18px; bottom: calc(76px + var(--safe-bottom)); z-index: 30;
    width: 58px; height: 58px; border-radius: 50%;
    background: var(--grad);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 22px rgba(201,123,90,.4);
    transition: transform .15s ease;
  }
  .fab:active { transform: scale(.9); }
  .fab svg { width: 26px; height: 26px; stroke: #fff; stroke-width: 2.6; position: relative; z-index: 1; }
  .fab::before {
    content: ''; position: absolute; inset: -4px; border-radius: 50%;
    background: radial-gradient(circle, rgba(232,168,124,.32), transparent 65%);
    animation: fabGlow 2.6s ease-in-out infinite; z-index: 0;
  }
  @keyframes fabGlow { 0%,100% { opacity: .45; transform: scale(1) } 50% { opacity: 1; transform: scale(1.18) } }

  /* ================= 底栏 ================= */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    background: rgba(255,253,249,.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid rgba(238,227,214,.9); padding-bottom: var(--safe-bottom);
    display: flex; align-items: center; justify-content: center; gap: 8px; height: 60px;
  }
  .tabbar .hint { font-size: 12.5px; color: #6f5a4b; letter-spacing: .5px; }

  /* ================= 弹窗 ================= */
  .mask {
    position: fixed; inset: 0; z-index: 40; background: rgba(60,40,25,.45);
    backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .22s ease;
  }
  .mask.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    background: rgba(255,252,247,.95);
    backdrop-filter: blur(26px) saturate(1.5); -webkit-backdrop-filter: blur(26px) saturate(1.5);
    border-radius: 26px 26px 0 0; max-height: 92vh; overflow-y: auto;
    box-shadow: 0 -12px 44px rgba(60,40,25,.16);
    transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    padding-bottom: calc(22px + var(--safe-bottom));
  }
  .sheet.show { transform: translateY(0); }
  .sheet .grip { width: 42px; height: 4.5px; border-radius: 3px; background: #e3d5c6; margin: 11px auto 4px; }
  .sheet h2 { margin: 10px 22px 4px; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 7px; }
  .sheet h2::before {
    content: ''; width: 5px; height: 18px; border-radius: 3px; background: var(--grad);
    display: inline-block;
  }
  .sheet .form { padding: 8px 22px 0; }
  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 7px; font-weight: 600; }
  .field input[type=text], .field input[type=number], .field textarea {
    width: 100%; padding: 12px 14px; border-radius: 13px; border: 1.5px solid var(--border);
    background: #fff; outline: none; transition: border .15s ease, box-shadow .15s ease;
  }
  .field input:focus, .field textarea:focus {
    border-color: var(--primary-bright);
    box-shadow: 0 0 0 4px rgba(232,168,124,.16);
  }
  .field textarea { resize: none; min-height: 64px; }

  /* 日期选择字段（点击弹自定义日历） */
  .date-field {
    display: flex; align-items: center; gap: 9px;
    padding: 12px 14px; border-radius: 13px; border: 1.5px solid var(--border);
    background: #fff; cursor: pointer;
    transition: border .15s ease, box-shadow .15s ease;
  }
  .date-field:active { border-color: var(--primary-bright); }
  .date-field svg { width: 17px; height: 17px; stroke: var(--primary); flex: 0 0 auto; }
  .date-field input {
    flex: 1; border: none; outline: none; background: transparent; padding: 0;
    pointer-events: none; cursor: pointer; font-size: 14.5px; color: var(--text);
  }
  .date-field input::placeholder { color: #b8a696; }
  .date-field .clear-btn {
    display: none; width: 18px; height: 18px; border-radius: 50%;
    background: #efe4d7; color: #8a7365; font-size: 11px; line-height: 1;
    align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .date-field.has-value .clear-btn { display: flex; }

  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg .opt {
    padding: 8px 15px; border-radius: 999px; background: #fff; border: 1.5px solid var(--border);
    font-size: 13px; color: var(--muted); transition: all .15s ease;
  }
  .seg .opt:active { transform: scale(.93); }
  .seg .opt.on {
    background: var(--grad); border-color: transparent; color: #fff; font-weight: 700;
    box-shadow: 0 4px 14px rgba(201,123,90,.3);
  }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatch {
    width: 31px; height: 31px; border-radius: 50%;
    border: 2.5px solid #fff;
    outline: 1.5px solid var(--border);
    position: relative; transition: all .15s ease;
  }
  .swatch:active { transform: scale(.9); }
  .swatch.on { outline: 2.5px solid var(--primary-bright); transform: scale(1.15); }
  .swatch.checked::after {
    content: ''; position: absolute; inset: 0; margin: auto; width: 13px; height: 13px;
    background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>') center/cover no-repeat;
  }

  /* 上传框 */
  .upload { display: flex; align-items: center; gap: 13px; }
  .upload .box {
    width: 84px; height: 84px; border-radius: 16px; border: 1.5px dashed #d9bfa4;
    background: linear-gradient(140deg, #fdf8f2, #faf3ea);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--muted); font-size: 11px; gap: 4px; overflow: hidden; position: relative;
    transition: border .15s ease, transform .15s ease;
  }
  .upload .box:active { transform: scale(.95); border-color: var(--primary-bright); }
  .upload .box svg { width: 22px; height: 22px; stroke: #d49a6f; }
  .upload .box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .upload .box .rm {
    position: absolute; top: 4px; right: 4px; width: 19px; height: 19px; border-radius: 50%;
    background: rgba(0,0,0,.55); color: #fff; font-size: 12px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .upload .tip { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .upload .tip b { color: var(--primary-deep); }

  .sheet .actions { display: flex; gap: 11px; padding: 10px 22px 0; }
  .btn {
    flex: 1; padding: 14px; border-radius: 15px; font-size: 15px; font-weight: 700;
    text-align: center; transition: all .15s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: #f2ebe0; color: var(--muted); }
  .btn.primary {
    background: var(--grad); color: #fff;
    box-shadow: 0 6px 20px rgba(201,123,90,.38);
  }
  .btn.primary:active { box-shadow: 0 2px 10px rgba(201,123,90,.3); }
  .btn.primary:disabled { opacity: .55; box-shadow: none; }
  .btn.danger { background: linear-gradient(135deg, #f87171, #ef4444); color: #fff; box-shadow: 0 6px 18px rgba(239,68,68,.35); }

  /* 确认弹窗 */
  .dialog {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(.92); z-index: 45;
    background: rgba(255,252,247,.96); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    border-radius: 22px; padding: 24px 22px 20px; width: 82%; max-width: 320px; text-align: center;
    box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: all .2s ease;
  }
  .dialog.show { opacity: 1; pointer-events: auto; transform: translate(-50%,-50%) scale(1); }
  .dialog p { margin: 4px 0 18px; font-size: 15px; font-weight: 600; }
  .dialog .row { display: flex; gap: 11px; }

  /* ================= 自定义日历弹层 ================= */
  .cal-mask {
    position: fixed; inset: 0; z-index: 50; background: rgba(60,40,25,.45);
    backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .22s ease;
  }
  .cal-mask.show { opacity: 1; pointer-events: auto; }
  .cal-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
    background: rgba(255,252,247,.97);
    backdrop-filter: blur(26px) saturate(1.5); -webkit-backdrop-filter: blur(26px) saturate(1.5);
    border-radius: 26px 26px 0 0;
    box-shadow: 0 -12px 44px rgba(60,40,25,.18);
    transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    padding: 11px 20px calc(22px + var(--safe-bottom));
  }
  .cal-sheet.show { transform: translateY(0); }
  .cal-sheet .grip { width: 42px; height: 4.5px; border-radius: 3px; background: #e3d5c6; margin: 0 auto 10px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-title { font-size: 16.5px; font-weight: 800; color: var(--text); letter-spacing: .5px; }
  .cal-nav {
    width: 36px; height: 36px; border-radius: 12px; background: var(--warm-gray);
    font-size: 19px; color: var(--primary-deep); display: flex; align-items: center; justify-content: center;
    transition: all .15s ease;
  }
  .cal-nav:active { transform: scale(.9); }
  .cal-nav:disabled { opacity: .3; }
  .cal-week {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px;
  }
  .cal-week span { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; padding: 4px 0; }
  .cal-week .wend { color: #cf8f8f; }
  .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-d {
    aspect-ratio: 1/1; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14.5px; color: var(--text); font-weight: 500;
    transition: all .12s ease; position: relative;
  }
  .cal-d:active { transform: scale(.88); }
  .cal-d.today::after {
    content: ''; position: absolute; inset: 2px; border-radius: 50%;
    border: 1.5px solid #eab68b;
  }
  .cal-d.sel { background: var(--grad); color: #fff; font-weight: 800; box-shadow: 0 4px 12px rgba(201,123,90,.35); }
  .cal-d.sel.today::after { border-color: rgba(255,255,255,.85); }
  .cal-d:disabled { color: #e3d8cc; }
  .cal-weekend { color: #b9776a; }
  .cal-actions { display: flex; gap: 10px; margin-top: 14px; }
  .cal-actions .btn.today-btn { background: var(--warm-gray); color: var(--primary-deep); flex: 0 0 auto; padding: 13px 18px; }

  /* toast */
  .toast {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 60;
    background: rgba(52,36,28,.78); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #fff; padding: 13px 24px; border-radius: 14px;
    font-size: 14px; font-weight: 500;
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
    box-shadow: 0 12px 32px rgba(60,40,25,.3);
  }
  .toast.show { opacity: 1; }

  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
    .container { max-width: 640px; margin: 0 auto; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- 顶栏 -->
  <header class="header">
    <div class="header-top">
      <div class="brand">
        <span class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l3 4M12 3L9 7M12 3v3M5 10h14M8 10v3a4 4 0 0 0 8 0v-3"/><path d="M12 13v3M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
        </span>
        <div>
          <h1>我的衣橱</h1>

        </div>
      </div>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="s-icon i-count">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v3l7 5.2a1.8 1.8 0 0 1-1 3.3H6a1.8 1.8 0 0 1-1-3.3L12 8"/><circle cx="12" cy="4" r="1.6"/></svg>
        </span>
        <div class="s-txt"><span class="num" id="stat-count">0</span><span class="lbl">件衣服</span></div>
      </div>
      <div class="stat">
        <span class="s-icon i-total">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v1H3z"/><rect x="3" y="8" width="18" height="11" rx="2"/><circle cx="16.5" cy="13.5" r="1.2"/></svg>
        </span>
        <div class="s-txt"><span class="num" id="stat-total">¥0</span><span class="lbl">总金额</span></div>
      </div>
      <div class="stat">
        <span class="s-icon i-avg">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0l-7-7A2 2 0 0 1 3 12.2V5a2 2 0 0 1 2-2h7.2a2 2 0 0 1 1.4.6l7 7a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
        </span>
        <div class="s-txt"><span class="num" id="stat-avg">¥0</span><span class="lbl">均价</span></div>
      </div>
    </div>
  </header>

  <!-- 分类 -->
  <nav class="cats" id="cats"></nav>

  <!-- 工具栏 -->
  <div class="toolbar">
    <div class="tags" id="tags"></div>
    <button class="btn-sort" id="btn-sort">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
      <span id="sort-label">金额↓</span>
    </button>
  </div>

  <!-- 网格 -->
  <main class="grid" id="grid"></main>
</div>

<!-- 悬浮添加 -->
<button class="fab" id="fab" aria-label="添加衣服">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- 底部 -->
<footer class="tabbar"><span class="hint">数据实时云端同步 · 多设备通用</span></footer>

<!-- 添加/编辑 抽屉 -->
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="grip"></div>
  <h2 id="sheet-title">添加衣服</h2>
  <div class="form">
    <div class="field">
      <label>图片</label>
      <div class="upload">
        <div class="box" id="upload-box">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5-9 9"/></svg>
          <span>拍照/相册</span>
        </div>
        <div class="tip"><b>自动压缩</b>再上传<br>点图片可移除</div>
      </div>
      <input type="file" id="file-input" accept="image/*" hidden>
    </div>
    <div class="field">
      <label>名称 <span style="color:var(--danger)">*</span></label>
      <input type="text" id="f-name" placeholder="例如：黑色羊毛大衣">
    </div>
    <div class="field">
      <label>分类</label>
      <div class="seg" id="f-cat"></div>

      <label>颜色</label>

      <label>性别</label>

      <input type="number" id="f-price" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
    </div>
    <div class="field">
      <label>购入时间</label>
      <div class="date-field" id="date-field">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        <input type="text" id="f-date" readonly placeholder="点击选择日期">
        <span class="clear-btn" id="date-clear">✕</span>
      </div>
    </div>
    <div class="field">
      <label>备注</label>
      <textarea id="f-note" placeholder="品牌、尺码、材质、穿搭想法…"></textarea>
    </div>
  </div>
  <div class="actions">
    <button class="btn ghost" id="btn-cancel">取消</button>
    <button class="btn primary" id="btn-save">保存</button>
  </div>
</div>

<!-- 自定义日历弹层 -->
<div class="cal-mask" id="cal-mask"></div>
<div class="cal-sheet" id="cal-sheet">
  <div class="grip"></div>
  <div class="cal-head">
    <button class="cal-nav" id="cal-prev">‹</button>
    <div class="cal-title" id="cal-title"></div>
    <button class="cal-nav" id="cal-next">›</button>
  </div>
  <div class="cal-week">
    <span class="wend">日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="wend">六</span>
  </div>
  <div class="cal-days" id="cal-days"></div>
  <div class="cal-actions">
    <button class="btn today-btn" id="cal-today">今天</button>
    <button class="btn ghost" id="cal-clear">清除</button>

</div>

<!-- 删除确认 -->
<div class="dialog" id="dialog">
  <p id="dialog-text">确定删除这件衣服？</p>
  <div class="row">
    <button class="btn ghost" id="dialog-no">取消</button>
    <button class="btn danger" id="dialog-yes">删除</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ---------- 配置 ----------
  const CFG = window.SUPABASE_CONFIG || {};
  const URL_BASE = (CFG.url || '').replace(/\/$/, '');
  const ANON_KEY = CFG.anonKey || '';

  const CATEGORIES = ['上衣', '下装', '连衣裙', '外套', '鞋', '配饰', '其他'];
  const SEASONS = ['春', '夏', '秋', '冬'];
  const GENDERS = ['男', '女', '中性'];
  const COLORS = [
    '#111827','#f8fafc','#9ca3af','#1d4ed8','#0ea5e9','#10b981',
    '#eab308','#f97316','#ef4444','#ec4899','#8b5cf6','#92400e',
    '#f5e6d3','#065f46','#1e293b'
  ];
  const CATEGORY_COLORS = { '上衣':'#d98a5f','下装':'#a9824f','连衣裙':'#cf7f96','外套':'#b0724d','鞋':'#7d9463','配饰':'#c48d5a','其他':'#a9866f' };
  const SEASON_COLORS = { '春':'#679b52','夏':'#e2a23b','秋':'#d97b29','冬':'#8ba7c4' };

  // ---------- 状态 ----------
  let owner = localStorage.getItem('wardrobe_owner');
  if (!owner) { owner = (crypto.randomUUID ? crypto.randomUUID() : ('u-' + Date.now() + Math.random().toString(16).slice(2))); localStorage.setItem('wardrobe_owner', owner); }

  const state = {
    clothes: [],
    filter: { category: '全部', gender: '全部', season: '全部' },
    sort: { key: 'price', dir: 'desc' },
    editingId: null,
    pendingImage: null
  };

  // ---------- 工具 ----------
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtMoney = (n) => { n = Number(n) || 0; return n.toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); };

  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800);
  }

  function todayStr() {
    const t = new Date();
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  }
  function fmtDateCN(s) {
    if (!s) return '';
    const p = s.split('-');
    return (+p[0]) + '年' + (+p[1]) + '月' + (+p[2]) + '日';
  }

  function timeSince(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    const now = new Date();
    const days = Math.floor((now.getTime() - d.getTime()) / 86400000);
    if (days < 0) return '未来日期';
    if (days === 0) return '今天';
    if (days < 30) return days + '天';
    if (days < 365) { const m = Math.floor(days / 30); return m + '个月'; }
    const y = Math.floor(days / 365); const m = Math.floor((days % 365) / 30);
    return m > 0 ? y + '年' + m + '个月' : y + '年';
  }

  // 颜色与白混合（ratio 为原色占比 0~1），生成浅色底
  function mixWhite(hex, ratio) {
    const n = hex.replace('#', '');
    const r = parseInt(n.slice(0, 2), 16), g = parseInt(n.slice(2, 4), 16), b = parseInt(n.slice(4, 6), 16);
    const m = (x) => Math.round(255 + (x - 255) * ratio).toString(16).padStart(2, '0');
    return '#' + m(r) + m(g) + m(b);
  }

  // ---------- API ----------
  function authHeaders(extra) {
    return Object.assign({ apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY }, extra || {});
  }
  function assertCfg() {
    if (!URL_BASE || !ANON_KEY || ANON_KEY.indexOf('你的') >= 0) {
      toast('请先在 config.js 填入 Supabase URL 和 anonKey');
      throw new Error('config missing');
    }
  }

  async function fetchClothes() {
    assertCfg();
    let url = URL_BASE + '/rest/v1/clothes?owner=eq.' + encodeURIComponent(owner) + '&select=*';
    if (state.filter.category !== '全部') url += '&category=eq.' + encodeURIComponent(state.filter.category);
    if (state.filter.gender !== '全部') url += '&gender=eq.' + encodeURIComponent(state.filter.gender);
    if (state.filter.season !== '全部') url += '&seasons=cs.%7B' + encodeURIComponent(state.filter.season) + '%7D';
    const col = state.sort.key === 'created_at' ? 'created_at' : (state.sort.key === 'purchased_at' ? 'purchased_at' : 'price');
    url += '&order=' + col + '.' + state.sort.dir + '.nullslast';
    const res = await fetch(url, { headers: authHeaders() });
    if (!res.ok) throw new Error('查询失败 ' + res.status);
    state.clothes = await res.json();
  }

  async function saveCloth(data) {
    assertCfg();
    if (state.editingId) {
      const res = await fetch(URL_BASE + '/rest/v1/clothes?id=eq.' + state.editingId + '&owner=eq.' + encodeURIComponent(owner), {
        method: 'PATCH', headers: authHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify(data)
      });
      if (!res.ok) throw new Error('保存失败 ' + res.status);
    } else {
      const res = await fetch(URL_BASE + '/rest/v1/clothes', {
        method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify(Object.assign({ owner: owner }, data))
      });
      if (!res.ok) throw new Error('保存失败 ' + res.status);
    }
  }

  async function removeCloth(id) {
    assertCfg();
    const res = await fetch(URL_BASE + '/rest/v1/clothes?id=eq.' + id + '&owner=eq.' + encodeURIComponent(owner), { method: 'DELETE', headers: authHeaders() });
    if (!res.ok) throw new Error('删除失败 ' + res.status);
  }

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const max = 900;
        let w = img.naturalWidth, h = img.naturalHeight;
        const ratio = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * ratio); h = Math.round(h * ratio);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        canvas.toBlob(b => b ? resolve(b) : reject(new Error('压缩失败')), 'image/jpeg', 0.78);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
      img.src = url;
    });
  }

  async function uploadImage(blob) {
    assertCfg();
    const path = owner + '/' + (crypto.randomUUID ? crypto.randomUUID() : Date.now()) + '.jpg';
    const res = await fetch(URL_BASE + '/storage/v1/object/clothes/' + path, {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'image/jpeg' }),
      body: blob
    });
    if (!res.ok) throw new Error('图片上传失败 ' + res.status);
    return URL_BASE + '/storage/v1/object/public/clothes/' + path;
  }

  // ---------- 渲染 ----------
  const catIcon = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="width:40px;height:40px"><path d="M12 3l3 4M12 3L9 7M12 3v3M5 10h14M8 10v3a4 4 0 0 0 8 0v-3"/></svg>';
  const emptyArtSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="url(#eg)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="eg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c97b5a"/><stop offset="1" stop-color="#b06a75"/></linearGradient></defs><path d="M12 3l3 4M12 3L9 7M12 3v3M5 10h14M8 10v3a4 4 0 0 0 8 0v-3"/><path d="M12 13v3M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>';

  function renderCats() {
    const el = $('#cats'); el.innerHTML = '';
    ['全部', ...CATEGORIES].forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip' + (state.filter.category === c ? ' on' : '');
      b.textContent = c;
      b.onclick = () => { state.filter.category = c; renderCats(); load(); };
      el.appendChild(b);
    });
  }

  function renderTags() {
    const el = $('#tags'); el.innerHTML = '';
    ['全部', ...GENDERS].forEach(g => {
      const b = document.createElement('button');
      b.className = 'tag' + (g === '全部' ? ' reset' : '') + (state.filter.gender === g ? ' on' : '');
      b.textContent = g === '全部' ? '性别不限' : g;
      b.onclick = () => { state.filter.gender = g; renderTags(); load(); };
      el.appendChild(b);
    });
    const br = document.createElement('span'); br.className = 'row-break'; el.appendChild(br);
    ['全部', ...SEASONS].forEach(s => {
      const b = document.createElement('button');
      b.className = 'tag' + (s === '全部' ? ' reset' : '') + (state.filter.season === s ? ' on' : '');
      b.textContent = s === '全部' ? '季节不限' : s;
      if (SEASON_COLORS[s]) {
        const d = document.createElement('span');
        d.className = 'sdot';
        d.style.background = SEASON_COLORS[s];
        b.insertBefore(d, b.firstChild);
      }
      b.onclick = () => { state.filter.season = s; renderTags(); load(); };
      el.appendChild(b);
    });
  }

  const SORT_OPTS = [
    { key: 'price', dir: 'desc', label: '金额↓' },
    { key: 'price', dir: 'asc', label: '金额↑' },
    { key: 'purchased_at', dir: 'desc', label: '购入新→旧' },
    { key: 'purchased_at', dir: 'asc', label: '购入旧→新' },
    { key: 'created_at', dir: 'desc', label: '录入时间' }
  ];
  let sortIdx = 0;
  function cycleSort() {
    sortIdx = (sortIdx + 1) % SORT_OPTS.length;
    state.sort = SORT_OPTS[sortIdx];
    $('#sort-label').textContent = SORT_OPTS[sortIdx].label;
    load();
  }

  function renderGrid() {
    const el = $('#grid');
    const list = state.clothes;
    const total = list.reduce((s, c) => s + (Number(c.price) || 0), 0);
    $('#stat-count').textContent = list.length;
    $('#stat-total').textContent = '¥' + fmtMoney(total);
    $('#stat-avg').textContent = list.length ? '¥' + fmtMoney(total / list.length) : '¥0';

    if (!list.length) {
      el.innerHTML = '<div class="empty">' +
        '<div class="art">' + emptyArtSvg + '</div>' +
        '<div class="t">衣橱还是空的</div>' +
        '<div class="s">拍张照，把心爱的衣服收进来</div>' +
        '<button class="empty-btn" id="empty-add">＋ 添加第一件</button>' +
      '</div>';
      $('#empty-add').onclick = openAdd;
      return;
    }
    el.innerHTML = list.map((c, i) => {
      const color = c.color || '';
      const swatch = color ? '<span class="cdot" style="background:' + esc(color) + (color.toLowerCase() === '#f8fafc' ? ';border-color:#cbd5e1' : '') + '"></span>' : '';
      const img = c.image_url ? '<img src="' + esc(c.image_url) + '" loading="lazy" alt="">' : catIcon.replace('style="width:40px;height:40px"', 'style="width:40px;height:40px" class="ph"');
      const price = Number(c.price) || 0;
      const catColor = CATEGORY_COLORS[c.category] || '#a9866f';
      const seasonPills = (c.seasons || []).map(s => {
        const sc = SEASON_COLORS[s] || '#a9866f';
        return '<span class="spill" style="background:' + mixWhite(sc, .16) + ';color:' + sc + '">' + esc(s) + '</span>';
      }).join('');
      return '<div class="card" style="animation-delay:' + Math.min(i * 45, 400) + 'ms" data-id="' + esc(c.id) + '">' +
        '<div class="thumb">' + img +
          '<span class="cat-badge" style="--cc:' + catColor + '">' + esc(c.category) + '</span>' +
          '<span class="del" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></span>' +
        '</div>' +
        '<div class="body">' +
          '<div class="name">' + esc(c.name) + '</div>' +
          '<div class="meta">' + swatch + '<span class="gpill">' + esc(c.gender) + '</span>' + seasonPills + '</div>' +
          '<div class="foot">' +
            '<span class="price-badge"><small>¥</small>' + fmtMoney(price) + '</span>' +
            '<span class="age-pill">' + esc(timeSince(c.purchased_at) || '未记录') + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    el.querySelectorAll('.card').forEach(card => {
      const id = card.dataset.id;
      const item = list.find(x => x.id === id);
      card.onclick = (e) => {
        if (e.target.closest('.del')) { askDelete(id); return; }
        openEdit(item);
      };
    });
  }

  async function load() {
    try {
      await fetchClothes();
      renderGrid();
    } catch (e) {
      console.error(e);
      toast(e.message || '加载失败');
      if (e.message === 'config missing') return;
      $('#grid').innerHTML = '<div class="empty"><div class="art">' + emptyArtSvg + '</div><div class="t">加载失败</div><div class="s">请检查 config.js 配置与网络</div></div>';
    }
  }

  // ---------- 表单 ----------
  function openSheet() {
    const sheet = $('#sheet');
    sheet.scrollTop = 0;   // 每次打开回到顶部
    sheet.classList.add('show');
    $('#mask').classList.add('show');
  }
  function closeSheet() {
    $('#sheet').classList.remove('show');
    $('#mask').classList.remove('show');
    state.editingId = null; state.pendingImage = null;
    closeCalendar();
  }

  function buildSeg(elId, items, getCurrent, setCurrent) {
    const el = document.getElementById(elId); el.innerHTML = '';
    items.forEach(it => {
      const b = document.createElement('button');
      b.className = 'opt' + (getCurrent() === it ? ' on' : '');
      b.textContent = it;
      b.onclick = () => { setCurrent(it); buildSeg(elId, items, getCurrent, setCurrent); };
      el.appendChild(b);
    });
  }

  let formColor = '';
  let formSeasons = [];
  let formCat = CATEGORIES[0];
  let formGender = '中性';
  let formDate = '';       // 'YYYY-MM-DD' 或 ''

  function renderColorPicker() {
    const el = $('#f-color'); el.innerHTML = '';
    COLORS.forEach(c => {
      const b = document.createElement('button');
      b.className = 'swatch' + (formColor === c ? ' on checked' : '');
      b.style.background = c;
      b.onclick = () => { formColor = c; renderColorPicker(); };
      el.appendChild(b);
    });
  }

  function renderDateField() {
    const df = $('#date-field');
    $('#f-date').value = formDate ? fmtDateCN(formDate) : '';
    df.classList.toggle('has-value', !!formDate);
  }

  function openAdd() {
    state.editingId = null; state.pendingImage = null;
    $('#sheet-title').textContent = '添加衣服';
    $('#f-name').value = ''; $('#f-price').value = ''; $('#f-note').value = '';
    formColor = ''; formSeasons = []; formCat = CATEGORIES[0]; formGender = '中性'; formDate = '';
    renderDateField();
    setPreview(null);
    buildSeg('f-cat', CATEGORIES, () => formCat, v => { formCat = v; });
    buildSeasons(); buildGender(); renderColorPicker();
    openSheet();
  }

  function buildSeasons() {
    const el = $('#f-seasons'); el.innerHTML = '';
    SEASONS.forEach(s => {
      const b = document.createElement('button');
      b.className = 'opt' + (formSeasons.includes(s) ? ' on' : '');
      b.textContent = s;
      b.onclick = () => { const i = formSeasons.indexOf(s); if (i >= 0) { formSeasons.splice(i, 1); } else { formSeasons.push(s); } buildSeasons(); };
      el.appendChild(b);
    });
  }
  function buildGender() {
    const el = $('#f-gender'); el.innerHTML = '';
    GENDERS.forEach(g => {
      const b = document.createElement('button');
      b.className = 'opt' + (formGender === g ? ' on' : '');
      b.textContent = g;
      b.onclick = () => { formGender = g; buildGender(); };
      el.appendChild(b);
    });
  }

  function openEdit(item) {
    state.editingId = item.id; state.pendingImage = null;
    $('#sheet-title').textContent = '编辑衣服';
    $('#f-name').value = item.name || '';
    $('#f-price').value = item.price != null ? item.price : '';
    $('#f-note').value = item.note || '';
    formCat = item.category || CATEGORIES[0];
    formColor = item.color || '';
    formSeasons = Array.isArray(item.seasons) ? item.seasons : [];
    formGender = item.gender || '中性';
    formDate = item.purchased_at || '';
    renderDateField();
    setPreview(item.image_url || null);
    buildSeg('f-cat', CATEGORIES, () => formCat, v => { formCat = v; });
    buildSeasons(); buildGender(); renderColorPicker();
    openSheet();
  }

  function setPreview(src) {
    const box = $('#upload-box');
    const oldImg = box.querySelector('img');
    if (oldImg) oldImg.remove();
    const oldRm = box.querySelector('.rm');
    if (oldRm) oldRm.remove();
    if (src) {
      const img = document.createElement('img'); img.src = src; box.appendChild(img);
      const rm = document.createElement('span'); rm.className = 'rm'; rm.textContent = '×';
      rm.onclick = (e) => { e.stopPropagation(); setPreview(null); };
      box.appendChild(rm);
    }
  }

  // ---------- 自定义日历 ----------
  const CAL_MIN = { y: 2010, m: 1 };
  let calYear = 0, calMonth = 1, tempDate = null;

  function monthStr() { return calYear + '-' + String(calMonth).padStart(2, '0'); }
  function isFutureMonth() {
    const t = new Date();
    return calYear > t.getFullYear() || (calYear === t.getFullYear() && calMonth > t.getMonth() + 1);
  }

  function openCalendar() {
    const base = formDate || todayStr();
    calYear = +base.slice(0, 4); calMonth = +base.slice(5, 7);
    tempDate = formDate || null;
    renderCalendar();
    $('#cal-sheet').classList.add('show');
    $('#cal-mask').classList.add('show');
  }
  function closeCalendar() {
    $('#cal-sheet').classList.remove('show');
    $('#cal-mask').classList.remove('show');
  }

  function renderCalendar() {
    $('#cal-title').textContent = calYear + '年' + calMonth + '月';
    $('#cal-prev').disabled = (calYear === CAL_MIN.y && calMonth === CAL_MIN.m);
    $('#cal-next').disabled = isFutureMonth();

    const firstDay = new Date(calYear, calMonth - 1, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth, 0).getDate();
    const today = todayStr();
    let html = '';
    for (let i = 0; i < firstDay; i++) html += '<span></span>';
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = calYear + '-' + String(calMonth).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      const weekend = (firstDay + d - 1) % 7 === 0 || (firstDay + d - 1) % 7 === 6;
      const cls = 'cal-d' + (weekend ? ' cal-weekend' : '') + (ds === today ? ' today' : '') + (ds === tempDate ? ' sel' : '');
      const future = ds > today ? ' disabled' : '';
      html += '<button class="' + cls + '" data-d="' + ds + '"' + future + '>' + d + '</button>';
    }
    $('#cal-days').innerHTML = html;
    $('#cal-days').querySelectorAll('.cal-d').forEach(b => {
      b.onclick = () => { tempDate = b.dataset.d; renderCalendar(); };
    });
  }

  $('#date-field').onclick = openCalendar;
  $('#cal-mask').onclick = closeCalendar;
  $('#cal-prev').onclick = () => {
    if (calMonth === 1) { calYear--; calMonth = 12; } else { calMonth--; }
    renderCalendar();
  };
  $('#cal-next').onclick = () => {
    if (!isFutureMonth()) {
      if (calMonth === 12) { calYear++; calMonth = 1; } else { calMonth++; }
      renderCalendar();
    }
  };
  $('#cal-today').onclick = () => {
    const t = todayStr();
    calYear = +t.slice(0, 4); calMonth = +t.slice(5, 7);
    tempDate = t; renderCalendar();
  };
  $('#cal-clear').onclick = () => { tempDate = null; formDate = ''; renderDateField(); closeCalendar(); };
  $('#cal-ok').onclick = () => {
    if (tempDate) formDate = tempDate;
    renderDateField();
    closeCalendar();
  };
  $('#date-clear').onclick = (e) => { e.stopPropagation(); formDate = ''; tempDate = null; renderDateField(); };

  // ---------- 事件绑定 ----------
  $('#fab').onclick = openAdd;
  $('#mask').onclick = closeSheet;
  $('#btn-cancel').onclick = closeSheet;
  $('#btn-sort').onclick = cycleSort;
  $('#upload-box').onclick = () => $('#file-input').click();
  $('#file-input').onchange = async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      toast('图片处理中…');
      const blob = await compressImage(file);
      state.pendingImage = blob;
      setPreview(URL.createObjectURL(blob));
      toast('图片已就绪，保存时上传');
    } catch (err) { toast(err.message); }
  };

  $('#btn-save').onclick = async () => {
    const name = $('#f-name').value.trim();
    if (!name) { toast('请填写名称'); return; }
    const btn = $('#btn-save');
    btn.disabled = true; btn.textContent = '保存中…';
    try {
      let imageUrl = state.pendingImage ? await uploadImage(state.pendingImage) : null;
      if (!imageUrl && state.editingId) {
        const cur = state.clothes.find(x => x.id === state.editingId);
        imageUrl = cur ? cur.image_url : null;
      }
      const payload = {
        name: name,
        category: formCat,
        color: formColor || null,
        seasons: formSeasons,
        gender: formGender,
        price: Number($('#f-price').value) || 0,
        purchased_at: formDate || null,
        image_url: imageUrl,
        note: $('#f-note').value.trim() || null
      };
      await saveCloth(payload);
      closeSheet();
      toast('已保存');
      await load();
    } catch (err) {
      console.error(err);
      toast(err.message || '保存失败');
    } finally {
      btn.disabled = false; btn.textContent = '保存';
    }
  };

  let delTarget = null;
  function askDelete(id) {
    delTarget = id;
    $('#dialog-text').textContent = '确定删除这件衣服？';
    $('#dialog').classList.add('show');
  }
  $('#dialog-no').onclick = () => { $('#dialog').classList.remove('show'); delTarget = null; };
  $('#dialog-yes').onclick = async () => {
    $('#dialog').classList.remove('show');
    if (!delTarget) return;
    try { await removeCloth(delTarget); delTarget = null; toast('已删除'); await load(); }
    catch (e) { toast(e.message); }
  };

  // ---------- 初始化 ----------
  renderCats();
  renderTags();
  $('#sort-label').textContent = SORT_OPTS[0].label;
  load();
})();
</script>
</body>
</html>
