    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px;
  }

  .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

    aspect-ratio: 1/1; border-radius: 50%;

  .cal-d.sel { background: var(--grad); color: #fff; font-weight: 800; box-shadow: 0 4px 12px rgba(234,161,51,.35); }

  /* 购入信息紧凑布局 */

  function todayStr() {

  }
  function fmtDateCN(s) {
    if (!s) return '';
    const p = s.split('-');
    return (+p[0]) + '年' + (+p[1]) + '月' + (+p[2]) + '日';
  }

  function timeSince(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    const now = new Date();
    const days = Math.floor((now.getTime() - d.getTime()) / 86400000);
    if (days < 0) return '未来日期';
    if (days === 0) return '今天';
    if (days < 30) return days + '天';
    if (days < 365) { const m = Math.floor(days / 30); return m + '个月'; }
    const y = Math.floor(days / 365); const m = Math.floor((days % 365) / 30);
    return m > 0 ? y + '年' + m + '个月' : y + '年';
  }

  // 颜色与白混合（ratio 为原色占比 0~1），生成浅色底
  function mixWhite(hex, ratio) {
    const n = hex.replace('#', '');
    const r = parseInt(n.slice(0, 2), 16), g = parseInt(n.slice(2, 4), 16), b = parseInt(n.slice(4, 6), 16);
    const m = (x) => Math.round(255 + (x - 255) * ratio).toString(16).padStart(2, '0');
    return '#' + m(r) + m(g) + m(b);
  }

  async function fetchClothes() {
    assertCfg();
    // 一次拉全量，筛选/排序全部本地做（数据量小：切筛选零网络请求，离线快照也能筛）
    const url = URL_BASE + '/rest/v1/clothes?owner=eq.' + encodeURIComponent(owner) + '&select=*&order=created_at.desc';
    const res = await fetch(url, { headers: authHeaders() });
    if (!res.ok) throw new Error('查询失败 ' + res.status);
    state.all = await res.json();

  function cacheKey() { return 'wardrobe_cache::' + owner; }
  function saveCache() {
    try {
      localStorage.setItem(cacheKey(), JSON.stringify({ t: Date.now(), list: state.all, filter: state.filter, sort: state.sort, sortIdx: sortIdx }));
      state.hasCache = true;
    } catch (e) { /* 存储不可用（隐私模式/空间满）不影响主流程 */ }
  }
  function restoreCache() {
    try {
      const raw = localStorage.getItem(cacheKey());
      if (!raw) return;
      const c = JSON.parse(raw);
      if (!c || !Array.isArray(c.list)) return;
      state.all = c.list;
      if (c.filter && c.filter.category && c.filter.gender && c.filter.season) state.filter = c.filter;
      if (c.sort && ['price', 'created_at', 'purchased_at'].indexOf(c.sort.key) > -1 && ['asc', 'desc'].indexOf(c.sort.dir) > -1) state.sort = c.sort;
      if (typeof c.sortIdx === 'number' && c.sortIdx >= 0 && c.sortIdx < SORT_OPTS.length) sortIdx = c.sortIdx;
      state.hasCache = true;
      renderCats(); renderTags();
      $('#sort-label').textContent = SORT_OPTS[sortIdx].label;
      applyView(); renderGrid();
    } catch (e) { /* 缓存损坏则忽略，走正常网络加载 */ }
  }

    const objPath = url.split('/storage/v1/object/public/clothes/')[1];
    fetch(URL_BASE + '/storage/v1/object/clothes/' + objPath, { method: 'DELETE', headers: authHeaders() })
      .then(r => { if (!r.ok) console.warn('图片清理未成功 ' + r.status); })
      .catch(() => {});
  }

  async function saveCloth(data) {
    assertCfg();
    let res;
    if (state.editingId) {
      res = await fetch(URL_BASE + '/rest/v1/clothes?id=eq.' + state.editingId + '&owner=eq.' + encodeURIComponent(owner), {
        method: 'PATCH', headers: authHeaders({ 'Content-Type': 'application/json', 'Prefer': 'return=representation' }), body: JSON.stringify(data)
      });
    } else {
      res = await fetch(URL_BASE + '/rest/v1/clothes', {
        method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json', 'Prefer': 'return=representation' }), body: JSON.stringify(Object.assign({ owner: owner }, data))
      });

    if (!res.ok) throw new Error('保存失败 ' + res.status);

  async function removeCloth(id) {

  // 本地排序（与数据库 order 参数一致：price/created_at/purchased_at，null 排最后）
  function sortLocal() {
    const key = state.sort.key, dir = state.sort.dir;
    state.clothes.sort((a, b) => {
      const va = key === 'price' ? (Number(a.price) || 0) : a[key];
      const vb = key === 'price' ? (Number(b.price) || 0) : b[key];
      if (va == null && vb == null) return 0;
      if (va == null) return 1;
      if (vb == null) return -1;
      const r = va < vb ? -1 : va > vb ? 1 : 0;
      return dir === 'desc' ? -r : r;
    });
  }

  // 记录是否匹配当前筛选（applyView 本地筛选视图时使用）
  function matchesFilter(c) {
    if (state.filter.category !== '全部' && c.category !== state.filter.category) return false;
    if (state.filter.gender !== '全部' && c.gender !== state.filter.gender) return false;
    if (state.filter.season !== '全部' && !(c.seasons || []).includes(state.filter.season)) return false;
    return true;
  }

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const max = 900;
        let w = img.naturalWidth, h = img.naturalHeight;
        const ratio = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * ratio); h = Math.round(h * ratio);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        // 优先 WebP（同画质体积约省一半）；老浏览器不支持编码时会回退成 PNG，此时改走 JPEG
        canvas.toBlob(b => {
          if (!b) return reject(new Error('压缩失败'));
          if (b.type === 'image/webp') return resolve(b);
          canvas.toBlob(b2 => b2 ? resolve(b2) : reject(new Error('压缩失败')), 'image/jpeg', 0.78);
        }, 'image/webp', 0.8);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
      img.src = url;
    });
  }

  async function uploadImage(blob) {
    assertCfg();
    const ext = blob.type === 'image/webp' ? 'webp' : 'jpg';
    const path = owner + '/' + (crypto.randomUUID ? crypto.randomUUID() : Date.now()) + '.' + ext;
    const res = await fetch(URL_BASE + '/storage/v1/object/clothes/' + path, {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': blob.type || 'image/jpeg' }),
      body: blob
    });
    if (!res.ok) throw new Error('图片上传失败 ' + res.status);
    return URL_BASE + '/storage/v1/object/public/clothes/' + path;
  }

    el.querySelectorAll('.thumb img').forEach(im => {

      console.error(e);
      if (e.message === 'config missing') {
        toast('Supabase 配置缺失，请检查 config.js');
        return;

      // 网络/服务不可达：国内访问 Supabase（新加坡）可能不稳定
      if (state.hasCache) {
        // 本地有快照：继续展示快照（筛选/排序仍可用），仅提示

  function smartMatch() {
    const name = $('#f-name').value.trim().toLowerCase();
    if (!name) return;
    if (!formColorTouched) {
      formColor = '';
      for (const row of COLOR_KEYWORDS) {
        if (row[0].some(k => name.indexOf(k) >= 0)) { formColor = row[1]; break; }
      }
      renderColorPicker();
    }
    if (!formCatTouched) {
      const prev = formCat;
      formCat = CATEGORIES[0];
      for (const row of CATEGORY_KEYWORDS) {
        if (row[0].some(k => name.indexOf(k) >= 0)) { formCat = row[1]; break; }
      }
      if (formCat !== prev) {

  // ---------- 自定义日历 ----------
  const CAL_MIN = { y: 2010, m: 1 };

  let yearPage = 0;       // 年月面板起始年

  function monthStr() { return calYear + '-' + String(calMonth).padStart(2, '0'); }
  function isFutureMonth() {
    const t = new Date();
    return calYear > t.getFullYear() || (calYear === t.getFullYear() && calMonth > t.getMonth() + 1);
  }

  function openCalendar() {
    const base = formDate || todayStr();
    calYear = +base.slice(0, 4); calMonth = +base.slice(5, 7);
    tempDate = formDate || null;
    calMode = 'days';
    renderCal();
    $('#cal-sheet').classList.add('show');

  function renderCal() { calMode === 'ym' ? renderYmPanel() : renderDays(); }

  function renderDays() {
    $('#cal-title').textContent = calYear + '年' + calMonth + '月 ▾';
    $('#cal-week').style.display = '';
    $('#cal-days').style.display = '';
    $('#cal-ym').style.display = 'none';
    $('#cal-prev').style.display = ''; $('#cal-next').style.display = '';
    $('#cal-prev').disabled = (calYear === CAL_MIN.y && calMonth === CAL_MIN.m);
    $('#cal-next').disabled = isFutureMonth();

    const firstDay = new Date(calYear, calMonth - 1, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth, 0).getDate();
    const today = todayStr();
    let html = '';
    for (let i = 0; i < firstDay; i++) html += '<span></span>';
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = calYear + '-' + String(calMonth).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      const weekend = (firstDay + d - 1) % 7 === 0 || (firstDay + d - 1) % 7 === 6;
      const cls = 'cal-d' + (weekend ? ' cal-weekend' : '') + (ds === today ? ' today' : '') + (ds === tempDate ? ' sel' : '');
      const future = ds > today ? ' disabled' : '';
      html += '<button class="' + cls + '" data-d="' + ds + '"' + future + '>' + d + '</button>';
    }
    $('#cal-days').innerHTML = html;
    $('#cal-days').querySelectorAll('.cal-d').forEach(b => {
      b.onclick = () => { tempDate = b.dataset.d; renderDays(); };
    });
  }

  // 年月选择面板：年份按12年一页快速跳，选完年再选月，回到日视图
  function renderYmPanel() {
    $('#cal-title').textContent = '选择年月';
    $('#cal-week').style.display = 'none';
    $('#cal-days').style.display = 'none';
    $('#cal-ym').style.display = '';
    $('#cal-prev').style.display = 'none'; $('#cal-next').style.display = 'none';

    const now = new Date();
    const nowY = now.getFullYear(), nowM = now.getMonth() + 1;
    const yEnd = Math.min(yearPage + 11, nowY);
    let html = '<div class="ym-decade">' +
      '<button class="cal-nav" id="ym-prev"' + (yearPage <= CAL_MIN.y ? ' disabled' : '') + '>‹</button>' +
      '<span class="d-lbl">' + yearPage + ' — ' + yEnd + '</span>' +
      '<button class="cal-nav" id="ym-next"' + (yEnd >= nowY ? ' disabled' : '') + '>›</button>' +
      '</div>';
    html += '<div class="ym-lbl">年份</div><div class="ym-grid">';
    for (let i = 0; i < 12; i++) {
      const y = yearPage + i;
      if (y > nowY) { html += '<span></span>'; continue; }
      html += '<button class="ym-opt' + (y === calYear ? ' on' : '') + '" data-y="' + y + '">' + y + '</button>';
    }
    html += '</div>';
    html += '<div class="ym-lbl">月份</div><div class="ym-grid">';
    for (let m = 1; m <= 12; m++) {
      const dis = (calYear === nowY && m > nowM) ? ' disabled' : '';
      html += '<button class="ym-opt' + (m === calMonth ? ' on' : '') + '" data-m="' + m + '"' + dis + '>' + m + '月</button>';
    }
    html += '</div>';
    $('#cal-ym').innerHTML = html;

    $('#ym-prev').onclick = () => { yearPage = Math.max(CAL_MIN.y, yearPage - 12); renderYmPanel(); };
    $('#ym-next').onclick = () => { yearPage = Math.min(yearPage + 12, Math.max(CAL_MIN.y, nowY - 11)); renderYmPanel(); };
    $('#cal-ym').querySelectorAll('[data-y]').forEach(b => {
      b.onclick = () => { calYear = +b.dataset.y; renderYmPanel(); };
    });
    $('#cal-ym').querySelectorAll('[data-m]').forEach(b => {
      b.onclick = () => { calMonth = +b.dataset.m; calMode = 'days'; renderCal(); };
    });

  // 手输日期解析：支持 2024-05-20 / 2024年5月20日 / 2024.5.20 / 20240520 / 5-20（默认今年），不支持未来日期
  function parseDateInput(str) {
    str = (str || '').trim().toLowerCase();
    if (!str) return '';
    let y = null, mo = null, d = null;
    let m = str.match(/^(\d{4})\s*[-/.年 ]\s*(\d{1,2})\s*[-/.月 ]\s*(\d{1,2})\s*日?$/);
    if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    if (y == null) { m = str.match(/^(\d{4})(\d{2})(\d{2})$/); if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; } }
    if (y == null) { m = str.match(/^(\d{1,2})\s*[-/.月 ]\s*(\d{1,2})\s*日?$/); if (m) { y = new Date().getFullYear(); mo = +m[1]; d = +m[2]; } }
    if (y == null) return '';
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return '';
    const dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return '';
    const s = y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    if (s > todayStr() || y < CAL_MIN.y) return '';
    return s;
  }
  const fDateInput = $('#f-date');
  fDateInput.addEventListener('input', () => {
    const s = parseDateInput(fDateInput.value);
    if (s) { formDate = s; renderDateField(); }
  });
  fDateInput.addEventListener('blur', () => {
    if (!fDateInput.value.trim()) { formDate = ''; renderDateField(); return; }
    const s = parseDateInput(fDateInput.value);
    if (s) formDate = s; else toast('日期格式：2024-05-20 或 5月20日');
    renderDateField();
  });

  // ---------- 数据同步（口令登录） ----------
  function isLogged() { return !!localStorage.getItem(PASS_KEY); }
  function renderLoginBtn() {
    const on = isLogged();
    $('#login-btn').classList.toggle('on', on);
    $('#lb-out').style.display = on ? 'none' : '';
    $('#lb-in').style.display = on ? '' : 'none';
  }
  async function hashPass(pass) {
    const data = new TextEncoder().encode('wardrobe-h5-salt-v1::' + pass);
    const buf = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 32);
  }
  async function migrateOwner(to) {
    if (owner === to) return 0;
    const res = await fetch(URL_BASE + '/rest/v1/clothes?owner=eq.' + encodeURIComponent(owner) + '&select=id', { headers: authHeaders() });
    if (!res.ok) throw new Error('查询失败 ' + res.status);
    const rows = await res.json();
    if (!rows.length) return 0;
    const res2 = await fetch(URL_BASE + '/rest/v1/clothes?id=in.(' + rows.map(r => r.id).join(',') + ')', {
      method: 'PATCH', headers: authHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ owner: to })
    });
    if (!res2.ok) throw new Error('数据迁移失败 ' + res2.status);
    return rows.length;
  }
  function showLoginView(v) {
    ['view-setup', 'view-login', 'view-done'].forEach(id => { $('#' + id).style.display = 'none'; });
    $('#' + v).style.display = '';
  }
  function openLoginSheet() {
    $('#btn-set-pass').dataset.txt = '设置口令并同步';
    $('#btn-set-pass').textContent = $('#btn-set-pass').dataset.txt;
    showLoginView(isLogged() ? 'view-done' : 'view-setup');
    $('#pass-1').value = ''; $('#pass-2').value = ''; $('#pass-old').value = '';
    $('#login-sheet').classList.add('show');
    $('#login-mask').classList.add('show');
  }
  function closeLoginSheet() {
    $('#login-sheet').classList.remove('show');
    $('#login-mask').classList.remove('show');
  }
  async function withBtn(btn, fn) {
    btn.disabled = true; btn.textContent = '处理中…';
    try { await fn(); }
    catch (e) { toast(e.message || '操作失败'); }
    finally { btn.disabled = false; btn.textContent = btn.dataset.txt; }
  }

  $('#btn-set-pass').onclick = () => {
    const p1 = $('#pass-1').value.trim(), p2 = $('#pass-2').value.trim();

    withBtn($('#btn-set-pass'), async () => {

      const n = await migrateOwner(h);
      owner = h; localStorage.setItem(PASS_KEY, h);

    try {

      if (state.pendingImage) { btn.textContent = '上传图片…'; imageUrl = await uploadImage(state.pendingImage); }
      if (!imageUrl && state.editingId) {
        const cur = state.clothes.find(x => x.id === state.editingId);
        imageUrl = cur ? cur.image_url : null;

      const payload = {

      if (state.editingId) {

    cleanStorageImage(item && item.image_url);
  };

  // ---------- 图片查看器（灯箱）：单击关闭，双击 2 倍放大 ----------
  let imgvTap = 0, imgvCloseTimer = null;
  const imgvEl = $('#imgv'), imgvImg = $('#imgv-img');
  imgvImg.onerror = () => {
    if (!imgvImg.getAttribute('src')) return;
    imgvEl.classList.remove('show');
    imgvImg.src = ''; imgvImg.classList.remove('zoom');
    toast('图片加载失败，请检查网络');
  };
  imgvEl.onclick = () => {
    const now = Date.now();
    if (now - imgvTap < 320) {
      clearTimeout(imgvCloseTimer);
      imgvImg.classList.toggle('zoom');
      imgvTap = 0;
      return;
    }
    imgvTap = now;
    imgvCloseTimer = setTimeout(() => {
      imgvEl.classList.remove('show');
      imgvImg.src = ''; imgvImg.classList.remove('zoom');
    }, 320);
  };

  // ---------- 数据导出 ----------
  function dateStamp() {
    const d = new Date();
    return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  }
  function downloadFile(name, mime, content) {
    const url = URL.createObjectURL(new Blob([content], { type: mime }));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  $('#export-btn').onclick = () => {
    if (!state.all.length) { toast('暂无可导出的数据'); return; }
    $('#export-dialog').classList.add('show');
  };
  $('#exp-cancel').onclick = () => $('#export-dialog').classList.remove('show');
  $('#exp-json').onclick = () => {
    $('#export-dialog').classList.remove('show');
    downloadFile('wardrobe-backup-' + dateStamp() + '.json', 'application/json',
      JSON.stringify({ app: 'wardrobe-h5', exported_at: new Date().toISOString(), count: state.all.length, items: state.all }, null, 2));
    toast('已导出 JSON 备份');
  };
  $('#exp-csv').onclick = () => {
    $('#export-dialog').classList.remove('show');
    const cols = ['名称', '分类', '尺码', '颜色', '季节', '性别', '金额', '购入时间', '购入平台', '图片链接', '备注', '录入时间'];
    const keys = ['name', 'category', 'size', 'color', 'seasons', 'gender', 'price', 'purchased_at', 'platform', 'image_url', 'note', 'created_at'];
    const cell = (v) => {
      if (v == null) return '';
      let s = Array.isArray(v) ? v.join('、') : String(v);
      if (/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
      return s;
    };
    let csv = '\uFEFF' + cols.join(',') + '\r\n';   // BOM 头，Excel 直接打开不乱码
    state.all.forEach(r => { csv += keys.map(k => cell(r[k])).join(',') + '\r\n'; });
    downloadFile('wardrobe-' + dateStamp() + '.csv', 'text/csv;charset=utf-8', csv);
    toast('已导出 CSV');
  };

  // ---------- 初始化 ----------
  renderCats();
  renderTags();
  renderLoginBtn();
  $('#sort-label').textContent = SORT_OPTS[0].label;
  restoreCache();   // 本地有快照则先秒显上次的视图（含筛选/排序状态）
  load();           // 再拉云端，成功后覆盖渲染并更新快照
})();
</script>
</body>
</html>
